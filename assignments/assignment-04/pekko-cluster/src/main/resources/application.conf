pekko {
  loglevel = "INFO"

  actor {
    provider = cluster
    allow-java-serialization = off
    serialization-bindings {
      "alarm.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    transport = tcp
    canonical.hostname = ${clustering.ip}
    canonical.port = ${clustering.port}
  }

  cluster {
    # the first seed node must be started first (AlarmApp does it)
    seed-nodes = [
      "pekko://"${clustering.cluster.name}"@"${clustering.ip}":2551",
      "pekko://"${clustering.cluster.name}"@"${clustering.ip}":2552"
    ]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    jmx.multi-mbeans-in-same-jvm = on
  }
}

clustering {
  ip = "127.0.0.1"
  port = 2551          # overridden by AlarmApp for each node
  cluster.name = "ClusterSystem"
}